<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11141b"><title>Quant research | Paper library</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#query">Skip to paper search</a>
<header class="site-header"><a class="brand" href="./">quant research</a><nav aria-label="Research workflow"><a href="./" aria-current="page">Paper library</a><a href="backtesting/">Backtesting</a><a href="https://github.com/LolStar123/quant-research-scraper">Source &#8599;</a></nav></header>
<main>

<div class="research-desk">
<section class="library" aria-label="Paper library">
<form id="search-form"><label for="query">Title, author or DOI</label><div class="search-row"><input id="query" type="search" placeholder="market microstructure" autocomplete="off"><button id="live" class="primary">Search Crossref</button></div><p id="status" role="status">Loading the bundled library...</p></form>
<div id="topics" class="topics" aria-label="Topic filters"></div>
<div class="result-tools"><p id="count"></p><div><button id="saved-filter" aria-pressed="false">Saved <b id="saved-count">0</b></button><select id="sort" aria-label="Order papers"><option value="citations">Most cited</option><option value="year">Newest</option><option value="title">Title A-Z</option></select></div></div>
<section id="papers" aria-label="Paper results"></section>
<nav class="pagination" aria-label="Paper pages"><button id="previous" aria-label="Previous page">&#8592;</button><span id="page-number"></span><button id="next" aria-label="Next page">&#8594;</button></nav>
<details class="reading-list"><summary>Reading list</summary><div><button id="export-bib">Export BibTeX</button><button id="export-json">Export JSON</button><label class="import-label" for="import">Import JSON<input id="import" type="file" accept=".json,application/json"></label></div></details>
</section>
<aside class="walk-forward" aria-labelledby="forward-title">
<div class="forward-head"><h2 id="forward-title">SPY walk-forward</h2></div>
<div class="experiment-inputs"><label for="forward-training">Training<select id="forward-training"><option value="252">252 sessions</option><option value="504" selected>504 sessions</option><option value="756">756 sessions</option></select></label><label for="forward-testing">Test window<select id="forward-testing"><option value="21">21 sessions</option><option value="63" selected>63 sessions</option><option value="126">126 sessions</option></select></label><label for="forward-cost">Cost per side / bp<input id="forward-cost" type="number" value="5" min="0" max="1000" step="1"></label><button id="run-test" disabled>Run test</button></div>
<p id="forward-state" class="panel-note" role="status">Loading prices...</p>
<div id="forward-stats" aria-label="Out-of-sample statistics"></div>
<div class="plot-label"><span>Equity / starts at 1</span><span><i class="strategy-key"></i>Rule <i class="benchmark-key"></i>Buy &amp; hold</span></div>
<div id="forward-chart" tabindex="0" role="group" aria-label="Inspect historical equity" aria-describedby="forward-cursor"></div><p id="forward-cursor" class="chart-cursor"></p>
<p id="forward-window" class="data-note"></p><a class="detail-link" href="backtesting/">Full experiment &#8594;</a>
<a class="detail-link" href="backtesting/#archive">Strategy archive &#8594;</a>
</aside>
</div>
<footer><span id="provenance"></span><a href="https://github.com/LolStar123/quant-research-scraper/blob/main/PROVENANCE.md">Docs &#8599;</a></footer>
</main><script type="module" src="app.mjs"></script>
</body></html>
